<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>なんちゃらなんちゃらなんちゃらなんちゃらゲーム</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101426;color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center;align-items:center;padding:16px}
.game{width:min(700px,100%);text-align:center}.hud{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px;font-weight:800}.hud span{background:#202846;padding:10px 14px;border-radius:12px;flex:1}
#field{position:relative;height:min(70vh,560px);min-height:420px;background:linear-gradient(135deg,#171f3b,#0c1022);border:3px solid #6474ff;border-radius:20px;overflow:hidden;box-shadow:0 15px 50px #0008}
.target{position:absolute;border:0;border-radius:999px;padding:12px 16px;background:#54d6ff;color:#07101c;font-weight:900;font-size:16px;cursor:pointer;user-select:none;animation:pop .12s ease-out}
.target.bad{background:#ff5b8d}.target:active{transform:scale(.9)}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
button#start{margin-top:14px;border:0;border-radius:14px;padding:12px 28px;background:#756cff;color:white;font-weight:900;font-size:17px;cursor:pointer}
h1{font-size:clamp(20px,5vw,32px);margin:0 0 14px}
#message{position:absolute;inset:0;display:grid;place-items:center;background:#0007;font-size:24px;font-weight:900;pointer-events:none}
</style>
</head>
<body>
<div class="game">
<h1>なんちゃらなんちゃらなんちゃらなんちゃらゲーム</h1>
<div class="hud"><span>スコア <b id="score">0</b></span><span>残り <b id="time">20</b>秒</span><span>コンボ <b id="combo">0</b></span></div>
<div id="field"><div id="message">スタートを押してね！</div></div>
<button id="start">ゲームスタート</button>
</div>
<script>
const field=document.getElementById('field'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),comboEl=document.getElementById('combo'),message=document.getElementById('message'),start=document.getElementById('start');
let score=0,time=20,combo=0,running=false,timer,spawnTimer;
function clear(){field.querySelectorAll('.target').forEach(e=>e.remove())}
function spawn(){
 if(!running)return;
 const e=document.createElement('button'),bad=Math.random()<.18;e.className='target'+(bad?' bad':'');e.textContent=bad?'なんちゃら？':'なんちゃら！';
 const x=Math.random()*(field.clientWidth-130)+10,y=Math.random()*(field.clientHeight-80)+10;
 e.style.left=x+'px';e.style.top=y+'px';
 e.onclick=()=>{if(!running)return;if(bad){score=Math.max(0,score-5);combo=0}else{combo++;score+=10+combo*2}update();e.remove()};
 field.appendChild(e);setTimeout(()=>e.remove(),1100);
}
function update(){scoreEl.textContent=score;timeEl.textContent=time;comboEl.textContent=combo}
function end(){running=false;clearInterval(timer);clearInterval(spawnTimer);clear();message.textContent='終了！ スコア '+score;message.style.display='grid';start.textContent='もう一回遊ぶ'}
function begin(){score=0;time=20;combo=0;running=true;message.style.display='none';start.textContent='プレイ中…';update();clear();spawn();spawnTimer=setInterval(spawn,520);timer=setInterval(()=>{time--;update();if(time<=0)end()},1000)}
start.onclick=()=>{if(!running)begin()};
update();
</script>
</body>
</html>
